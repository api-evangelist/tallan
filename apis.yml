name: Tallan
description: >-
  Tallan was a Hartford, Connecticut technology consultancy, founded in 1985,
  that built custom Microsoft- and Azure-powered solutions — application
  modernization, e-commerce and web development, user experience, mobile, cloud,
  data, and AI/ML — for clients in manufacturing, consumer packaged goods,
  pharma, healthcare, and state and local government. In February 2023 Tallan
  was acquired by EY US and folded into EY's Microsoft services group; the
  tallan.com domain now 301-redirects to EY's Microsoft alliance page. Tallan
  operated as a professional-services consultancy and never published a public
  API, developer portal, SDKs, or event surface, so there is no API to enrich.
